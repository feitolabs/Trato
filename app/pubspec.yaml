name: trato
description: "Trato — serviço feito, dinheiro liberado. Um app Feito Labs."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  crypto: ^3.0.8
  flutter:
    sdk: flutter
  geolocator: ^13.0.2
  google_sign_in: 6.3.0
  image_picker: ^1.1.2
  sign_in_with_apple: ^8.2.0
  supabase_flutter: ^2.18.3
  http: ^1.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  fonts:
    - family: Archivo
      fonts:
        - asset: assets/fontes/Archivo.ttf
    - family: Figtree
      fonts:
        - asset: assets/fontes/Figtree.ttf
