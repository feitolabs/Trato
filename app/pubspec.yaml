name: trato
description: "Trato — serviço feito, dinheiro liberado. Um app Feito Labs."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  crypto: ^3.0.8
  flutter_secure_storage: 9.2.4
  shared_preferences: 2.5.6
  geolocator: 13.0.2
  image: 4.3.0
  image_picker: 1.1.2
  permission_handler: 11.3.1
  flutter:
    sdk: flutter
  google_sign_in: 7.2.0
  sign_in_with_apple: ^8.2.0
  supabase_flutter: ^2.18.3
  http: ^1.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  fonts:
    - family: Archivo
      fonts:
        - asset: assets/fontes/Archivo.ttf
    - family: Figtree
      fonts:
        - asset: assets/fontes/Figtree.ttf
